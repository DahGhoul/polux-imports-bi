services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: polux-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-PoluxDemo_2026!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - polux_sql_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: polux-api
    environment:
      PORT: 3000
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-PoluxDemo_2026!}
      DB_NAME: POLUX_OLTP
    depends_on:
      - sqlserver
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: polux-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  polux_sql_data:
